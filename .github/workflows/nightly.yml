name: Create New Release

on:
  workflow_dispatch:
  
jobs:
  nightly:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          persist-credentials: false

      - name: Pull Git LFS assets for IDeviceKit
        run: |
          git config --global --unset-all http.https://github.com/.extraheader || true
          git -C IDeviceKit config --unset-all http.https://github.com/.extraheader || true
          git -C IDeviceKit lfs pull

      - name: Use Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Build
        run: |
          agvtool new-version -all $(git rev-parse HEAD)
          make
          mkdir upload
          mv packages/* upload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Protokolle
          path: upload/*
